<!DOCTYPE html>
<html>
<head>
<title>Wishlist</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family:Arial;
background:#f1f3f6;
margin:0;
padding:0;
}

.wishlist-card{
background:#fff;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}

.wishlist-card img{
width:100px;
height:100px;
object-fit:contain;
}

.price{
font-weight:bold;
font-size:20px;
margin-top:5px;
}

  .wishlist-header{
background:#2874f0;
color:white;
height:56px;
display:flex;
align-items:center;
padding:0 16px;
font-size:20px;
font-weight:500;
}

.tabs{
display:flex;
background:white;
width:100%;
}

.tab{
flex:1;
text-align:center;
padding:16px;
font-size:18px;
}

.active{
color:#2874f0;
border-bottom:3px solid #2874f0;
}

.collection-card{
background:white;
margin-top:15px;
border-radius:4px;
overflow:hidden;
border:1px solid #ddd;
}

.preview-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:4px;
padding:8px;
}

.preview-grid img{
width:100%;
height:80px;
object-fit:contain;
background:#f5f5f5;
}

  .collection-card{
cursor:pointer;
}
#createCollectionBtn{
position:fixed;
bottom:0;
left:0;
right:0;
height:56px;
background:white;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
color:#2874f0;
border-top:1px solid #ddd;
}

#collectionPopup{
position:fixed;
left:0;
right:0;
bottom:-100%;
background:white;
transition:.3s;
z-index:999;
border-radius:16px 16px 0 0;
}

.popup-header{
padding:20px;
font-size:24px;
display:flex;
gap:20px;
border-bottom:1px solid #eee;
}

.popup-body{
padding:20px;
}

.collection-input{
width:100%;
padding:15px;
font-size:18px;
border:1px solid #ddd;
border-radius:8px;
}

.radio-row{
display:block;
padding:15px 0;
font-size:20px;
}

.create-btn{
width:100%;
height:50px;
background:#2874f0;
color:white;
border:none;
font-size:18px;
border-radius:8px;
}
</style>
</head>

<body>

<div class="wishlist-header">
  <span onclick="history.back()"
style="font-size:28px;margin-right:20px;">
←
  </span>
  <span>Wishlist & Collections</span>
</div>

<div class="tabs">
  <div class="tab active">My Collections</div>
  <div class="tab">Collections I Follow</div>
</div>

<div id="collectionContainer"></div>
  
  <div id="wishlistItems"></div>

<script>

const wishlist =
JSON.parse(localStorage.getItem("wishlist")) || [];
document.getElementById("wishlistItems")
.style.display = "none";
  let previewImages = "";

wishlist.slice(0,4).forEach(item=>{
previewImages += `
<img src="images/${item.images ? item.images[0] : item.img}">
`;
});

document.getElementById("collectionContainer").innerHTML = `
<div class="collection-card">

<div class="preview-grid">
${previewImages}
</div>

<div style="padding:15px;">
<div style="font-size:30px;">
My Wishlist
</div>

<div style="color:gray;margin-top:5px;">
🔒 Private • ${wishlist.length} items
</div>
</div>

</div>
`;
  console.log(wishlist);  
document
.getElementById("createCollectionBtn")
.onclick=()=>{
document
.getElementById("collectionPopup")
.style.bottom="0";
};

function closePopup(){
document
.getElementById("collectionPopup")
.style.bottom="-100%";
}
  
</script>

  <div id="createCollectionBtn">
    + Create a new collection
</div>

<div id="collectionPopup">

<div class="popup-header">
<span onclick="closePopup()">✕</span>
<span>Create a new collection</span>
</div>

<div class="popup-body">

<input
type="text"
placeholder="Collection name*"
class="collection-input">

<p style="color:gray;">*Required</p>

<h3>Share settings</h3>

<label class="radio-row">
<input type="radio" name="share" checked>
Private
</label>

<label class="radio-row">
<input type="radio" name="share">
Shared
</label>

<label class="radio-row">
<input type="radio" name="share">
Public
</label>

<button class="create-btn">
Create collection
</button>

</div>
</div>
</body>
</html>
