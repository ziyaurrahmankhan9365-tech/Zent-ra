<!DOCTYPE html>
<html>
<head>
<title>Wishlist</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family:Arial;
background:#f1f3f6;
margin:0;
padding:0;
}

.wishlist-card{
background:#fff;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}

.wishlist-card img{
width:100px;
height:100px;
object-fit:contain;
}

.price{
font-weight:bold;
font-size:20px;
margin-top:5px;
}

  .wishlist-header{
background:#2874f0;
color:white;
height:56px;
display:flex;
align-items:center;
padding:0 16px;
font-size:20px;
font-weight:500;
}

.tabs{
display:flex;
background:white;
width:100%;
}

.tab{
flex:1;
text-align:center;
padding:16px;
font-size:18px;
}

.active{
color:#2874f0;
border-bottom:3px solid #2874f0;
}

.collection-card{
background:white;
margin-top:15px;
border-radius:4px;
overflow:hidden;
border:1px solid #ddd;
}

.preview-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:4px;
padding:8px;
}

.preview-grid img{
width:100%;
height:80px;
object-fit:contain;
background:#f5f5f5;
}

  .collection-card{
cursor:pointer;
}
#createCollectionBtn{
position:fixed;
bottom:0;
left:0;
right:0;
height:56px;
background:white;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
color:#2874f0;
border-top:1px solid #ddd;
}

#collectionPopup{
position:fixed;
left:0;
right:0;
bottom:-100%;
background:white;
transition:.3s;
z-index:999;
border-radius:16px 16px 0 0;
}

.popup-header{
padding:20px;
font-size:24px;
display:flex;
gap:20px;
border-bottom:1px solid #eee;
}

.popup-body{
padding:24px;
}

.collection-input{
width:100%;
box-sizing:border-box;
padding:16px;
font-size:18px;
border:1px solid #ddd;
border-radius:4px;
height:74px;
}

.radio-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 0;
font-size:20px;
border-bottom:1px solid #eee;
}

.radio-row small{
color:gray;
font-size:14px;
}

.create-btn{
width:100%;
height:52px;
background:#d6d6d6;
color:white;
border:none;
font-size:18px;
font-weight:500;
position:sticky;
bottom:0;
border-radius:0;
}

.create-btn:disabled{
background:#d6d6d6;
color:white;
cursor:not-allowed;
}

.create-btn.active{
background:#2874f0 !important;
color:#fff !important;
}
  
.suggestions{
display:flex;
gap:10px;
overflow-x:auto;
margin:10px 0 25px;
}

.chip{
padding:10px 16px;
border:1px solid #ddd;
border-radius:25px;
background:white;
white-space:nowrap;
font-size:16px;
cursor:pointer;
}

.chip:hover{
background:#f5f5f5;
}

  #overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.45);
display:none;
z-index:998;
  }
  
#followCollections{
text-align:center;
padding-top:120px;
}

.empty-heart{
width:180px;
height:180px;
}

#followCollections h2{
font-size:34px;
margin-top:20px;
}

#followCollections p{
color:gray;
font-size:20px;
padding:0 30px;
}

.hand-heart{
position:relative;
width:220px;
margin:auto;
height:220px;
}

.hand{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
font-size:90px;
line-height:1;
}

.heart{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%) scale(0);
font-size:70px;
z-index:2;
animation:heartMagic 3s infinite;
}

@keyframes heartMagic{

0%{
transform:translateX(-50%) translateY(40px) scale(0);
opacity:0;
}

30%{
transform:translateX(-50%) translateY(0) scale(1);
opacity:1;
}

50%{
transform:translateX(-50%) translateY(0) scale(1.2);
filter:drop-shadow(0 0 15px #ff4d6d);
}

100%{
transform:translateX(-50%) translateY(-25px) scale(1);
opacity:1;
}
}
  
</style>
</head>

<body>

  <div id="overlay"></div>

  <div class="wishlist-header">
  <span onclick="history.back()"
style="font-size:28px;margin-right:20px;">
←
  </span>
  <span>Wishlist & Collections</span>
</div>

<div class="tabs">
  <div class="tab active" id="myTab">My Collections</div>

<div class="tab" id="followTab">Collections I Follow</div>
</div>

<div id="collectionContainer"></div>
  
  <div id="wishlistItems"></div>

 <div id="followCollections" style="display:none;">

<div class="hand-heart">

<div class="heart">❤️</div>

<div class="hand">🤲</div>

</div> 

<h2>It's empty in here</h2>

<p>
Follow collections you love to find them here
</p>

  </div>
<script>

const wishlist =
JSON.parse(localStorage.getItem("wishlist")) || [];
document.getElementById("wishlistItems")
.style.display = "none";
  let previewImages = "";

wishlist.slice(0,4).forEach(item=>{
previewImages += `
<img src="images/${item.images ? item.images[0] : item.img}">
`;
});

document.getElementById("collectionContainer").innerHTML = `
<div class="collection-card">

<div class="preview-grid">
${previewImages}
</div>

<div style="padding:15px;">
<div style="font-size:30px;">
My Wishlist
</div>

<div style="color:gray;margin-top:5px;">
🔒 Private • ${wishlist.length} items
</div>
</div>

</div>
`;
  console.log(wishlist);  
window.onload = function(){

document
.getElementById("createCollectionBtn")
.onclick=()=>{
document
.getElementById("collectionPopup")
.style.bottom="0";
document.getElementById("overlay").style.display="block";
};

};

function closePopup(){
document
.getElementById("collectionPopup")
.style.bottom="-100%";
document.getElementById("overlay").style.display="none";
}
  
</script>

  <div id="createCollectionBtn">
    + Create a new collection
</div>

<div id="collectionPopup">

<div class="popup-header">
<span onclick="closePopup()">✕</span>
<span>Create a new collection</span>
</div>

<div class="popup-body">

<input
type="text"
placeholder="Collection name*"
class="collection-input">

<p style="color:gray;">*Required</p>
<p style="color:gray;margin-top:25px;">Suggestions</p>

<div class="suggestions">
  <span class="chip">My Birthday Wishlist</span>
  <span class="chip">Clothing Must Haves</span>
</div>
  
<h3>Share settings</h3>

<label class="radio-row">

<div>
🔒 <b>Private</b>
<br>
<small>Only you can view</small>
</div>

 <input type="radio" name="share" checked> 
  
</label>

<label class="radio-row">

<div>
👥 <b>Shared</b>
<br>
<small>Only people with link can view</small>
</div>

<input type="radio" name="share">

</label>

<label class="radio-row">

<div>
🌐 <b>Public</b>
<br>
<small>Anyone can search for and view</small>
</div>

<input type="radio" name="share">

</label>

<button id="createBtn" class="create-btn" disabled>
Create collection
</button>

</div>
</div>

  <script>
document.getElementById("createBtn").onclick=function(){

let name=document.querySelector(".collection-input").value;

if(name.trim()==""){
alert("Enter collection name");
return;
}

alert("Collection Created: " + name);

closePopup();

};

  const inputBox =
document.querySelector(".collection-input");

const createBtn =
document.getElementById("createBtn");

function checkInput(){

if(inputBox.value.trim()!==""){

createBtn.disabled=false;
createBtn.classList.add("active");
console.log("Button Enabled");
}else{

createBtn.disabled=true;
createBtn.classList.remove("active");

}

}

inputBox.addEventListener(
"input",
checkInput
);

document.querySelectorAll(".chip")
.forEach(chip=>{

chip.addEventListener(
"click",
function(){

inputBox.value=this.innerText;

checkInput();

});

});
checkInput();
  </script>

  <script>

function showMyCollections(){

document.getElementById("collectionContainer").style.display="block";
document.getElementById("wishlistItems").style.display="block";
document.getElementById("followCollections").style.display="none";
document.getElementById("createCollectionBtn").style.display="block";

document.getElementById("myTab").classList.add("active");
document.getElementById("followTab").classList.remove("active");

localStorage.setItem("activeTab","my");

}
    
document.getElementById("myTab").onclick=function(){
showMyCollections();
};

 document.getElementById("followTab").onclick=function(){

document.getElementById("collectionContainer").style.display="none";
document.getElementById("wishlistItems").style.display="none";
document.getElementById("followCollections").style.display="block";
document.getElementById("createCollectionBtn").style.display="none";
  
document.getElementById("followTab").classList.add("active");
document.getElementById("myTab").classList.remove("active");
localStorage.setItem("activeTab","follow");
   
};

  window.onload=function(){

if(localStorage.getItem("activeTab")==="follow"){

document.getElementById("collectionContainer").style.display="none";
document.getElementById("wishlistItems").style.display="none";
document.getElementById("followCollections").style.display="block";
document.getElementById("createCollectionBtn").style.display="none";

document.getElementById("followTab").classList.add("active");
document.getElementById("myTab").classList.remove("active");

}else{

showMyCollections();

}

};
    
  </script>
  
</body>
</html>
