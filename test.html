<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Roboto", Arial, sans-serif;
    background: #f1f3f6;
    color: #212121;
  }

  .page {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
  }

  /* ---------- price block (just for context above offers) ---------- */
  .price-block { padding: 12px 16px 0; }
  .price-row { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
  .discount { color: #388e3c; font-weight: 700; font-size: 18px; }
  .mrp { color: #878787; text-decoration: line-through; font-size: 15px; }
  .price { font-weight: 700; font-size: 22px; }

  /* ================= OFFER SECTION ================= */
  .offer-section {
    margin: 14px 12px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #c2dcff;
  }

  .offer-header {
    background: #2874f0;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    cursor: pointer;
  }

  .offer-header-left { display: flex; align-items: center; gap: 10px; }

  .wow-deal-badge {
    background: #000;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    line-height: 1.2;
    padding: 4px 6px;
    border-radius: 3px;
    text-align: center;
    letter-spacing: 0.2px;
  }

  .offer-header-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.25;
  }

  .offer-arrow {
    font-size: 18px;
    transition: transform 0.25s ease;
    transform: rotate(180deg);
  }
  .offer-arrow.open { transform: rotate(0deg); }

  .offer-content {
    background: #eaf2ff;
    padding: 14px 12px 16px;
  }

  .offer-price-line {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .offers-label {
    color: #878787;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
  }

  /* ---- offer cards grid ---- */
  .offer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  @media (max-width: 380px) {
    .offer-grid { grid-template-columns: 1fr; }
  }

  .offer-card {
    background: #fff;
    border-radius: 10px;
    padding: 10px;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }

  .best-value-badge {
    background: #ffe072;
    color: #614c00;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 8px;
    width: fit-content;
  }

  .offer-card-main {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .offer-card-info {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }

  .offer-logo {
    width: 32px;
    height: 32px;
    border-radius: 4px;
    object-fit: contain;
    flex-shrink: 0;
    background: #f5f5f5;
  }

  .offer-text {
    font-size: 12.5px;
    line-height: 1.3;
    font-weight: 600;
    color: #212121;
  }

  .apply-btn {
    color: #2874f0;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    padding-top: 2px;
  }
  .apply-btn:active { opacity: 0.6; }

  .offer-category-strip {
    margin-top: 10px;
    background: #f5f5f5;
    border-radius: 6px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    color: #333;
  }

  .offer-category-strip .chevron {
    color: #878787;
    font-weight: 700;
  }

  /* ================= other sections ================= */
  .section {
    padding: 16px;
    border-top: 8px solid #f1f3f6;
  }
  .section h3 {
    font-size: 16px;
    margin-bottom: 10px;
  }
  .highlight-item {
    font-size: 13.5px;
    line-height: 1.7;
    color: #212121;
  }
  .description-text {
    font-size: 13.5px;
    line-height: 1.6;
    color: #212121;
  }

  .similar-products {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .similar-card {
    flex: 0 0 120px;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 8px;
  }
  .similar-card img {
    width: 100%;
    height: 90px;
    object-fit: contain;
  }
  .similar-card .sp-name {
    font-size: 11px;
    margin-top: 6px;
    line-height: 1.3;
    height: 28px;
    overflow: hidden;
  }
  .similar-card .sp-price {
    font-size: 12px;
    font-weight: 700;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="page">

  <div class="price-block">
    <div class="price-row">
      <span class="discount">↓84%</span>
      <span class="mrp">₹2,999</span>
      <span class="price">₹486</span>
    </div>
  </div>

  <!-- OFFER SECTION -->
  <div class="offer-section">
    <div class="offer-header" id="offerHeader">
      <div class="offer-header-left">
        <div class="wow-deal-badge">WOW<br>DEAL</div>
        <div class="offer-header-title">Apply offers for<br>maximum savings</div>
      </div>
      <div class="offer-arrow open" id="offerArrow">⌃</div>
    </div>

    <div class="offer-content" id="offerContent">
      <div class="offer-price-line">Buy at ₹436</div>
      <div class="offers-label">Bank Offers</div>
      <div class="offer-grid" id="offerList"></div>
    </div>
  </div>

  <!-- PRODUCT HIGHLIGHTS -->
  <div class="section">
    <h3>Product Highlights</h3>
    <div id="productHighlights"></div>
  </div>

  <!-- DESCRIPTION -->
  <div class="section">
    <h3>Description</h3>
    <p class="description-text" id="productDescription"></p>
  </div>

  <!-- SIMILAR PRODUCTS -->
  <div class="section">
    <h3>Similar Products</h3>
    <div class="similar-products" id="similarProducts"></div>
  </div>

</div>

<script>
/* =========================================================
   PRODUCT DATA  (replace this with your real product object)
   ========================================================= */
const product = {
  rating: 4.2,
  reviews: 18452,
  description: "DUJE BT-110 In-the-Ear earbuds deliver up to 38 hours of total playtime, AI ENC for crystal-clear calls, and Deep Bass-77 sound. Lightweight, true wireless design built for all-day comfort.",
  highlights: [
    "Up to 38 Hours Total Playtime",
    "AI ENC Technology for Clear Calls",
    "Deep Bass-77 Sound Profile",
    "Bluetooth 5.3 with Low Latency",
    "IPX5 Sweat & Splash Resistant"
  ],
  offers: [
    {
      title: "₹50 Off on BHIM UPI",
      type: "UPI",
      logo: "images/upi.png"
      category: "UPI Cashback",
      bestValue: true
    },
    {
      title: "₹50 Cashback on Paytm UPI",
      type: "UPI",
      logo: "images/upi.png"
      category: "UPI Cashback",
      bestValue: false
    },
    {
      title: "₹2000 Off on HDFC Credit Card",
      type: "BANK",
      logo: "images/hdfc.png"
      category: "Credit Card Offer",
      bestValue: false
    },
    {
      title: "No Cost EMI up to 12 months",
      type: "EMI",
      logo: "images/emi.png"
      category: "EMI Offer",
      bestValue: false
    }
  ],
  similar: [
    { name: "boAt Airdopes 141", price: "₹999", img: "https://cdn-icons-png.flaticon.com/512/3659/3659899.png" },
    { name: "Noise Buds VS104", price: "₹799", img: "https://cdn-icons-png.flaticon.com/512/3659/3659899.png" },
    { name: "Realme Buds T100", price: "₹699", img: "https://cdn-icons-png.flaticon.com/512/3659/3659899.png" }
  ]
};

/* =========================================================
   RENDER OFFERS
   ========================================================= */
function renderOffers() {
  const offerListEl = document.getElementById("offerList");

  if (!product.offers || product.offers.length === 0) {
    offerListEl.innerHTML = "<p style='font-size:12px;color:#878787;'>No offers available right now.</p>";
    return;
  }

  let offerHTML = "";

  product.offers.forEach(offer => {
    offerHTML += `
      <div class="offer-card">
        ${offer.bestValue ? `<span class="best-value-badge">Best value for you</span>` : ""}
        <div class="offer-card-main">
          <div class="offer-card-info">
            <img class="offer-logo" src="${offer.logo}" alt="${offer.type}" onerror="this.style.visibility='hidden'">
            <span class="offer-text">${offer.title}</span>
          </div>
          <div class="apply-btn">Apply</div>
        </div>
        <div class="offer-category-strip">
          <span>${offer.category}</span>
          <span class="chevron">&gt;</span>
        </div>
      </div>
    `;
  });

  offerListEl.innerHTML = offerHTML;
}

/* =========================================================
   RENDER HIGHLIGHTS
   ========================================================= */
function renderHighlights() {
  const el = document.getElementById("productHighlights");
  let highlightsHTML = "";

  product.highlights.forEach(item => {
    highlightsHTML += `<p class="highlight-item">✔ ${item}</p>`;
  });

  el.innerHTML = highlightsHTML;
}

/* =========================================================
   RENDER DESCRIPTION
   ========================================================= */
function renderDescription() {
  document.getElementById("productDescription").innerText = product.description;
}

/* =========================================================
   RENDER SIMILAR PRODUCTS
   ========================================================= */
function renderSimilar() {
  const el = document.getElementById("similarProducts");
  let html = "";

  product.similar.forEach(item => {
    html += `
      <div class="similar-card">
        <img src="${item.img}" alt="${item.name}">
        <div class="sp-name">${item.name}</div>
        <div class="sp-price">${item.price}</div>
      </div>
    `;
  });

  el.innerHTML = html;
}

/* =========================================================
   COLLAPSE / EXPAND OFFER SECTION
   ========================================================= */
function setupOfferToggle() {
  const header = document.getElementById("offerHeader");
  const arrow = document.getElementById("offerArrow");
  const content = document.getElementById("offerContent");

  header.addEventListener("click", () => {
    const isOpen = content.style.display !== "none";

    if (isOpen) {
      content.style.display = "none";
      arrow.classList.remove("open");
    } else {
      content.style.display = "block";
      arrow.classList.add("open");
    }
  });
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  renderOffers();
  renderHighlights();
  renderDescription();
  renderSimilar();
  setupOfferToggle();
}

init();
</script>

</body>
</html>
