<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f3f6;
}

.product-container{
    background:#fff;
    padding:15px;
}

.product-image{
    width:100%;
    max-height:350px;
    object-fit:contain;
}

.rating{
    display:inline-block;
    background:#388e3c;
    color:#fff;
    padding:4px 8px;
    border-radius:4px;
    margin-top:10px;
}

.product-title{
    font-size:22px;
    margin-top:10px;
    font-weight:600;
   margin-bottom:12px;
}

.price{
    font-size:32px;
    font-weight:700;
    color:#000;
}

.old-price{
    text-decoration:line-through;
    color:#888;
    margin-left:10px;
}

.offer{
    color:green;
    font-weight:600;
}

.section{
    background:#fff;
    margin-top:10px;
    padding:15px;
}

.bottom-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    display:flex;
}

.cart-btn{
    width:50%;
    padding:18px;
    border:none;
    font-size:18px;
    background:#fff;
}

.buy-btn{
    width:50%;
    padding:18px;
    border:none;
    font-size:20px;
background:#ffc400;
font-weight:700;
}
.slider{
  position:relative;
}

#dots{
  text-align:center;
  margin:10px 0;
}

.dot{
  height:8px;
  width:8px;
  margin:0 4px;
  background:#ccc;
  border-radius:50%;
  display:inline-block;
}

.active-dot{
  background:#2874f0;
}

.price-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

#discountPercent{
    color:#388e3c;
    font-weight:700;
    font-size:30px;
}

.price{
    font-size:32px;
    font-weight:700;
}

.old-price{
    text-decoration:line-through;
    color:#878787;
    font-size:18px;
}
.offer-box{
    margin-top:15px;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #b3d9ff;
    background:#dff1ff;
}

.offer-header{
    background:#0d5eff;
    color:white;
    padding:14px;
    font-size:16px;
    font-weight:500;
}

.offer-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}
    
.offer-content{
    padding:15px;
}

.offer-price{
    font-size:22px;
    font-weight:700;
    margin-bottom:15px;
}

.offer-card{
    background:white;
    border-radius:12px;
    border:1px solid #e5e5e5;
    padding:10px;
    min-height:110px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}
    
.offer-card{
    transition:0.2s;
}

.offer-card:active{
    transform:scale(0.98);
}

.offer-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.apply-btn{
    color:#2874f0;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}
#offerArrow{
    transition:0.3s;
}
.applied-offer{
    background:white;
    border-radius:12px;
    padding:12px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.remove-btn{
    color:#2874f0;
    font-weight:700;
    cursor:pointer;
}
.image-wrapper{
    position:relative;
}

.rating-badge{
    position:absolute;
    left:20px;
    bottom:20px;

.rating-badge span:first-child{
    color:#388e3c;
    font-weight:700;
}
    
    background:#fff;
    border-radius:10px;

    padding:6px 10px;

    font-size:14px;
    font-weight:700;

    display:flex;
    gap:6px;
    align-items:center;

    box-shadow:0 2px 6px rgba(0,0,0,0.15);
}
#productReviews{
    color:#878787;
    font-weight:500;
}
.product-actions{
    position:absolute;
    top:20px;
    right:12px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.action-btn{
    width:44px;
    height:44px;
    background:#fff;
    border:none;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

.action-btn svg{
    width:24px;
    height:24px;
}
</style>

</head>
<body>

<div class="product-container">

<div class="image-wrapper">

    <div class="slider">
        <img id="productImage" src="" class="product-image">

        <div class="product-actions">

<button id="wishlistBtn" class="action-btn">
🤍
</button>

<button id="shareBtn" class="action-btn" onclick="shareProduct()">

<svg width="24" height="24" viewBox="0 0 24 24" fill="none">
<path d="M21 3L10 14"
stroke="#000"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round"/>

<path d="M21 3L14 21L10 14L3 10L21 3Z"
stroke="#000"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round"/>
</svg>

</button>

</div>
    </div>

    <div class="rating-badge">
        <span id="productRating"></span>
        |
        <span id="productReviews"></span>
    </div>

</div>

<div id="dots"></div>
    
<div class="product-title" id="productName"></div>

<div class="price-row">
    <span id="discountPercent"></span>
    <span class="old-price" id="oldPrice"></span>
    <span class="price" id="productPrice"></span>
</div>

<p class="offer" id="productOffer"></p>

<div class="offer-box">

    <div class="offer-header">

    <div style="display:flex;align-items:center;gap:10px;">

        <div style="
        background:#000;
        color:#fff;
        padding:4px 8px;
        border-radius:6px;
        font-size:12px;
        font-weight:700;
        ">
        WOW DEAL
        </div>

        <span>Apply offers for maximum savings</span>

    </div>

    <span id="offerArrow" style="font-size:24px;cursor:pointer;">⌃</span>

    </div>

    <div class="offer-content" id="offerContent">

        <h3 style="
margin:0 0 12px;
font-size:16px;
font-weight:600;
color:#444;
">
Bank Offers
</h3>

        <div class="offer-price" id="offerPrice">
        </div>

       <div id="appliedOfferBox" style="display:none;"></div>
        
        <div id="offerList" class="offer-grid"></div>

    </div>

</div>
    
</div>

<div class="section">
<h3>Product Highlights</h3>

<div id="productHighlights"></div>

</div>

<div class="section">
  <h3>Description</h3>
  <p id="productDescription"></p>
</div>

<div class="section">
  <h3>Similar Products</h3>
  <div id="similarProducts"></div>
</div>
    
<div style="height:90px;"></div>

<div class="bottom-bar">
<button class="cart-btn">
Add to Cart
</button>

<button class="buy-btn">
Buy Now
</button>
</div>
<script>
    const product =
JSON.parse(localStorage.getItem("selectedProduct"));
console.log(product);
if(product){

document.getElementById("productName").innerText =
product.name;

document.getElementById("productPrice").innerText =
"₹" + product.price;

document.getElementById("oldPrice").innerText =
"₹" + product.oldPrice;

document.getElementById("productOffer").innerText =
product.offer;

document.getElementById("offerPrice").innerText =
product.offer;
    
let oldPrice = parseInt(product.oldPrice);
let price = parseInt(product.price);

let discount = Math.round(
((oldPrice - price) / oldPrice) * 100
);

document.getElementById("discountPercent").innerHTML =
"↓" + discount + "%";

document.getElementById("productImage").src =
"images/" + product.img;

if(product.images && product.images.length > 0){

let currentImage = 0;

document.getElementById("productImage").src =
"images/" + product.images[0];

let dotsHTML = "";

product.images.forEach((img,index)=>{
dotsHTML += `
<span class="dot ${index===0 ? 'active-dot' : ''}"></span>
`;
});

document.getElementById("dots").innerHTML = dotsHTML;

let startX = 0;

const slider = document.querySelector(".slider");

slider.addEventListener("touchstart",(e)=>{
startX = e.touches[0].clientX;
});

slider.addEventListener("touchend",(e)=>{

let endX = e.changedTouches[0].clientX;

if(startX - endX > 50){

currentImage++;

if(currentImage >= product.images.length){
currentImage = 0;
}

}

else if(endX - startX > 50){

currentImage--;

if(currentImage < 0){
currentImage = product.images.length - 1;
}

}

document.getElementById("productImage").src =
"images/" + product.images[currentImage];

let dots = document.querySelectorAll(".dot");

dots.forEach(dot=>dot.classList.remove("active-dot"));

dots[currentImage].classList.add("active-dot");
});

}
    
document.getElementById("productRating").innerHTML =
product.rating + ' <span style="color:#388e3c;">★</span>';

document.getElementById("productReviews").innerText =
product.reviews + " Reviews";
    
 document.getElementById("productDescription").innerText =
product.description;

    let offerHTML = "";

if(product.offers){

product.offers.forEach(offer => {

offerHTML += `
<div class="offer-card">

<div>
<div style="
background:#f4d77a;
display:inline-block;
padding:3px 8px;
border-radius:6px;
font-size:12px;
font-weight:700;
margin-bottom:6px;">
Best value for you
</div>

<div style="
color:#008c3a;
font-size:13px;
font-weight:600;
margin-top:4px;">
${offer.includes("UPI")
? "UPI Cashback"
: offer.includes("EMI")
? "Pay Later Available"
: "Bank Offer"}
</div>

<div style="
display:flex;
flex-direction:column;
align-items:flex-start;
gap:10px;
margin-top:10px;">

<div style="
display:flex;
align-items:center;
gap:8px;
flex:1;">

<img src="${
offer.includes('UPI')
? 'images/upi.png'
: offer.includes('EMI')
? 'images/emi.jpg'
: 'images/hdfc.png'
}" width="40">

<b style="
font-size:13px;
line-height:1.3;
font-weight:600;">
${offer}
</b>

</div>

<div class="apply-btn" style="align-self:flex-end;">
Apply
</div>

</div>

<div style="
background:#f5f5f5;
padding:6px 10px;
margin-top:8px;
border-radius:8px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:12px;
font-weight:600;
color:#333;">

<span>
${offer.includes('UPI')
? 'UPI • Cashback'
: offer.includes('EMI')
? 'EMI • Pay Later'
: 'Credit Card • Cashback'}
</span>

<span>›</span>

</div>

</div>

</div>
`;
});

document.getElementById("offerList").innerHTML = offerHTML;
}

let highlightsHTML = "";

product.highlights.forEach(item => {
  highlightsHTML += `<p>✔ ${item}</p>`;
});

document.getElementById("productHighlights").innerHTML =
highlightsHTML;
}
const arrow = document.getElementById("offerArrow");
const content = document.getElementById("offerContent");

arrow.addEventListener("click", ()=>{

    if(content.style.display === "none"){
        content.style.display = "block";
        arrow.innerHTML = "⌃";
       arrow.style.transform = "rotate(0deg)";
    }else{
        content.style.display = "none";
        arrow.innerHTML = "⌄";
    arrow.style.transform = "rotate(180deg)";
    }

});
document.querySelectorAll(".apply-btn").forEach(btn => {

    btn.addEventListener("click", () => {

const offerText =
btn.parentElement.querySelector("b").innerText;

localStorage.setItem(
"appliedOffer",
offerText
);

showAppliedOffer();

});

});
function showAppliedOffer(){

const offer =
localStorage.getItem("appliedOffer");

if(!offer) return;

document.getElementById("appliedOfferBox").style.display = "block";

document.getElementById("appliedOfferBox").innerHTML = `

<div class="applied-offer">

<div>
✅ ${offer}
</div>

<div class="remove-btn"
onclick="removeOffer()">
Remove
</div>

</div>

`;

}
    function removeOffer(){

localStorage.removeItem("appliedOffer");

document.getElementById(
"appliedOfferBox"
).style.display = "none";

    }
 const wishlistBtn =
document.getElementById("wishlistBtn");

wishlistBtn.addEventListener("click",()=>{

if(wishlistBtn.innerHTML==="🤍"){

wishlistBtn.innerHTML="❤️";
showWishlistToast(
"Product is added to My Wishlist"
);
    
  let wishlist =
JSON.parse(
localStorage.getItem("wishlist")
) || [];

if(!wishlist.find(item => item.name === product.name)){

    wishlist.push(product);

}

localStorage.setItem(
"wishlist",
JSON.stringify(wishlist)
);
}
else{

wishlistBtn.innerHTML="💔";
let wishlist =
JSON.parse(
localStorage.getItem("wishlist")
) || [];

wishlist = wishlist.filter(
item => item.name !== product.name
);

localStorage.setItem(
"wishlist",
JSON.stringify(wishlist)
);
    showWishlistToast(
"Product removed from My Wishlist"
);
    
setTimeout(()=>{
wishlistBtn.innerHTML="🤍";
},2000);

}

});
   function showWishlistToast(message){

const toast =
document.getElementById("wishlistToast");

document.getElementById("toastText")
.innerText = message;

toast.style.display = "flex";

setTimeout(()=>{
toast.style.display = "none";
},5000);

   }
    showAppliedOffer();

function shareProduct(){

if(navigator.share){

navigator.share({
title: document.getElementById("productName").innerText,
text: "Check out this product on ShopMart",
url: window.location.href
});

}else{

navigator.clipboard.writeText(window.location.href);
alert("Link copied");

}

    }
</script>
<div id="wishlistToast" style="
position:fixed;
bottom:80px;
left:15px;
right:15px;
background:#212121;
color:white;
padding:16px;
border-radius:8px;
display:none;
justify-content:space-between;
align-items:center;
z-index:9999;
">

<span id="toastText"></span>

<span id="toastAction"
style="color:#ffb300;font-weight:bold;">
CHANGE
</span>

</div>
</body>
</html>
