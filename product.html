<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f3f6;
}

.product-container{
    background:#fff;
    padding:15px;
}

.product-image{
    width:100%;
    max-height:350px;
    object-fit:contain;
}

.rating{
    display:inline-block;
    background:#388e3c;
    color:#fff;
    padding:4px 8px;
    border-radius:4px;
    margin-top:10px;
}

.product-title{
    font-size:22px;
    margin-top:10px;
    font-weight:600;
}

.price{
    font-size:32px;
    font-weight:700;
    color:#000;
}

.old-price{
    text-decoration:line-through;
    color:#888;
    margin-left:10px;
}

.offer{
    color:green;
    font-weight:600;
}

.section{
    background:#fff;
    margin-top:10px;
    padding:15px;
}

.bottom-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    display:flex;
}

.cart-btn{
    width:50%;
    padding:18px;
    border:none;
    font-size:18px;
    background:#fff;
}

.buy-btn{
    width:50%;
    padding:18px;
    border:none;
    font-size:20px;
background:#ffc400;
font-weight:700;
}
.slider{
  position:relative;
}

#dots{
  text-align:center;
  margin:10px 0;
}

.dot{
  height:8px;
  width:8px;
  margin:0 4px;
  background:#ccc;
  border-radius:50%;
  display:inline-block;
}

.active-dot{
  background:#2874f0;
}

.price-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

#discountPercent{
    color:#388e3c;
    font-weight:700;
    font-size:30px;
}

.price{
    font-size:32px;
    font-weight:700;
}

.old-price{
    text-decoration:line-through;
    color:#878787;
    font-size:18px;
}
.offer-box{
    margin-top:15px;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #b3d9ff;
    background:#dff1ff;
}

.offer-header{
    background:#0d5eff;
    color:white;
    padding:14px;
    font-size:16px;
    font-weight:500;
}

.offer-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}
    
.offer-content{
    padding:15px;
}

.offer-price{
    font-size:22px;
    font-weight:700;
    margin-bottom:15px;
}

.offer-card{
    background:white;
    border-radius:12px;
    border:1px solid #e5e5e5;
    padding:10px;
    min-height:110px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
}
.offer-card{
    transition:0.2s;
}

.offer-card:active{
    transform:scale(0.98);
}

.offer-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.apply-btn{
    color:#2874f0;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}
#offerArrow{
    transition:0.3s;
}
</style>

</head>
<body>

<div class="product-container">

<div class="slider">
  <img id="productImage" src="" class="product-image">
</div>

<div id="dots"></div>

<div class="rating" id="productRating"></div>

<div class="rating" id="productRating"></div>
<div id="productReviews"></div>
    
<div class="product-title" id="productName"></div>

<div class="price-row">
    <span id="discountPercent"></span>
    <span class="old-price" id="oldPrice"></span>
    <span class="price" id="productPrice"></span>
</div>

<p class="offer" id="productOffer"></p>

<div class="offer-box">

    <div class="offer-header">

    <div style="display:flex;align-items:center;gap:10px;">

        <div style="
        background:#000;
        color:#fff;
        padding:4px 8px;
        border-radius:6px;
        font-size:12px;
        font-weight:700;
        ">
        WOW DEAL
        </div>

        <span>Apply offers for maximum savings</span>

    </div>

    <span id="offerArrow" style="font-size:24px;cursor:pointer;">⌃</span>

    </div>

    <div class="offer-content" id="offerContent">

        <h3 style="
margin:0 0 12px;
font-size:16px;
font-weight:600;
color:#444;
">
Bank Offers
</h3>

        <div class="offer-price" id="offerPrice">
        </div>

        <div id="offerList" class="offer-grid"></div>

    </div>

</div>
    
</div>

<div class="section">
<h3>Product Highlights</h3>

<div id="productHighlights"></div>

</div>

<div class="section">
  <h3>Description</h3>
  <p id="productDescription"></p>
</div>

<div class="section">
  <h3>Similar Products</h3>
  <div id="similarProducts"></div>
</div>
    
<div style="height:90px;"></div>

<div class="bottom-bar">
<button class="cart-btn">
Add to Cart
</button>

<button class="buy-btn">
Buy Now
</button>
</div>
<script>
const product =
JSON.parse(localStorage.getItem("selectedProduct"));

if(product){

document.getElementById("productName").innerText =
product.name;

document.getElementById("productPrice").innerText =
"₹" + product.price;

document.getElementById("oldPrice").innerText =
"₹" + product.oldPrice;

document.getElementById("productOffer").innerText =
product.offer;

document.getElementById("offerPrice").innerText =
product.offer;
    
let oldPrice = parseInt(product.oldPrice);
let price = parseInt(product.price);

let discount = Math.round(
((oldPrice - price) / oldPrice) * 100
);

document.getElementById("discountPercent").innerHTML =
"↓" + discount + "%";

document.getElementById("productImage").src =
"images/" + product.img;

if(product.images && product.images.length > 0){

let currentImage = 0;

document.getElementById("productImage").src =
"images/" + product.images[0];

let dotsHTML = "";

product.images.forEach((img,index)=>{
dotsHTML += `
<span class="dot ${index===0 ? 'active-dot' : ''}"></span>
`;
});

document.getElementById("dots").innerHTML = dotsHTML;

let startX = 0;

const slider = document.querySelector(".slider");

slider.addEventListener("touchstart",(e)=>{
startX = e.touches[0].clientX;
});

slider.addEventListener("touchend",(e)=>{

let endX = e.changedTouches[0].clientX;

if(startX - endX > 50){

currentImage++;

if(currentImage >= product.images.length){
currentImage = 0;
}

}

else if(endX - startX > 50){

currentImage--;

if(currentImage < 0){
currentImage = product.images.length - 1;
}

}

document.getElementById("productImage").src =
"images/" + product.images[currentImage];

let dots = document.querySelectorAll(".dot");

dots.forEach(dot=>dot.classList.remove("active-dot"));

dots[currentImage].classList.add("active-dot");

    
document.getElementById("productRating").innerText =
product.rating + " ★";

document.getElementById("productReviews").innerText =
product.reviews + " Reviews";
    
 document.getElementById("productDescription").innerText =
product.description;

document.getElementById("offerList").innerHTML = offerHTML;
}

let highlightsHTML = "";

product.highlights.forEach(item => {
  highlightsHTML += `<p>✔ ${item}</p>`;
});

document.getElementById("productHighlights").innerHTML =
highlightsHTML;
}
const arrow = document.getElementById("offerArrow");
const content = document.getElementById("offerContent");

arrow.addEventListener("click", ()=>{

    if(content.style.display === "none"){
        content.style.display = "block";
        arrow.innerHTML = "⌃";
       arrow.style.transform = "rotate(0deg)";
    }else{
        content.style.display = "none";
        arrow.innerHTML = "⌄";
    arrow.style.transform = "rotate(180deg)";
    }

});
document.querySelectorAll(".apply-btn").forEach(btn => {

    btn.addEventListener("click", () => {

        alert("Offer Applied Successfully 🎉");

    });

});
</script>
</body>
</html>
