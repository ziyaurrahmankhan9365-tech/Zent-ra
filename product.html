<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f3f6;
}

.product-container{
    background:#fff;
    padding:15px;
}

.product-image{
    width:100%;
    max-height:350px;
    object-fit:contain;
}

.rating{
    display:inline-block;
    background:#388e3c;
    color:#fff;
    padding:4px 8px;
    border-radius:4px;
    margin-top:10px;
}

.product-title{
    font-size:22px;
    margin-top:10px;
    font-weight:600;
}

.price{
    font-size:32px;
    font-weight:700;
    color:#000;
}

.old-price{
    text-decoration:line-through;
    color:#888;
    margin-left:10px;
}

.offer{
    color:green;
    font-weight:600;
}

.section{
    background:#fff;
    margin-top:10px;
    padding:15px;
}

.bottom-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    display:flex;
}

.cart-btn{
    width:50%;
    padding:18px;
    border:none;
    font-size:18px;
    background:#fff;
}

.buy-btn{
    width:50%;
    padding:18px;
    border:none;
    font-size:18px;
    background:#ffcc00;
    font-weight:bold;
}
.slider{
  position:relative;
}

#dots{
  text-align:center;
  margin:10px 0;
}

.dot{
  height:8px;
  width:8px;
  margin:0 4px;
  background:#ccc;
  border-radius:50%;
  display:inline-block;
}

.active-dot{
  background:#2874f0;
}
</style>

</head>
<body>

<div class="product-container">

<div class="slider">
  <img id="productImage" src="" class="product-image">
</div>

<div id="dots"></div>

<div class="rating" id="productRating"></div>

<div class="rating" id="productRating"></div>
<div id="productReviews"></div>
    
<div class="product-title" id="productName"></div>

<p>
<span class="price" id="productPrice"></span>
<span class="old-price" id="oldPrice"></span>
</p>

<p class="offer" id="productOffer"></p>

</div>

<div class="section">
<h3>Product Highlights</h3>

<div id="productHighlights"></div>

</div>

<div class="section">
  <h3>Description</h3>
  <p id="productDescription"></p>
</div>

<div class="section">
  <h3>Similar Products</h3>
  <div id="similarProducts"></div>
</div>
    
<div style="height:90px;"></div>

<div class="bottom-bar">
<button class="cart-btn">
Add to Cart
</button>

<button class="buy-btn">
Buy Now
</button>
</div>
<script>
const product =
JSON.parse(localStorage.getItem("selectedProduct"));

if(product){

document.getElementById("productName").innerText =
product.name;

document.getElementById("productPrice").innerText =
"₹" + product.price;

document.getElementById("oldPrice").innerText =
"₹" + product.oldPrice;

document.getElementById("productOffer").innerText =
product.offer;
    
document.getElementById("productImage").src =
"images/" + product.img;

if(product.images && product.images.length > 0){

let currentImage = 0;

document.getElementById("productImage").src =
"images/" + product.images[0];

let dotsHTML = "";

product.images.forEach((img,index)=>{
dotsHTML += `
<span class="dot ${index===0 ? 'active-dot' : ''}"></span>
`;
});

document.getElementById("dots").innerHTML = dotsHTML;

setInterval(()=>{

currentImage++;

if(currentImage >= product.images.length){
currentImage = 0;
}

document.getElementById("productImage").src =
"images/" + product.images[currentImage];

let dots = document.querySelectorAll(".dot");

dots.forEach(dot=>dot.classList.remove("active-dot"));

dots[currentImage].classList.add("active-dot");

},3000);

}
    
document.getElementById("productRating").innerText =
product.rating + " ★";

document.getElementById("productReviews").innerText =
product.reviews + " Reviews";
    
 document.getElementById("productDescription").innerText =
product.description;

let highlightsHTML = "";

product.highlights.forEach(item => {
  highlightsHTML += `<p>✔ ${item}</p>`;
});

document.getElementById("productHighlights").innerHTML =
highlightsHTML;
}
</script>
</body>
</html>
